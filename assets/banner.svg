  <text x="424" y="204" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="30" fill="#4A5A6C">Parse localized numbers and currency strings in JavaScript</text>
