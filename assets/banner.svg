    <text x="452" y="290" fill="#4A5A6C">parseFloat("1.234,56")</text>
    <text x="900" y="290" fill="#F25C54" font-weight="700">// 1.234</text>
    <text x="452" y="326" fill="#1D2B3A">parse("1.234,56", "pt-BR")</text>
